<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tra cứu khách hàng - Shipper</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="container">
    <h1>🚚 Tra cứu khách hàng</h1>
    <p>Tra cứu bằng số điện thoại hoặc 2 - 4 số cuối</p>
  </div>
</header>


<main class="container">

  <!-- ================= SEARCH ================= -->

  <section class="card">

    <h2>🔎 Tra cứu</h2>

    <div class="search-box">

      <input
        id="searchInput"
        type="tel"
        inputmode="numeric"
        placeholder="Nhập SĐT hoặc 2 - 4 số cuối..."
        autocomplete="off"
      >

      <button id="searchButton">
        🔍 Tìm
      </button>

    </div>

    <div class="hint">
      Ví dụ: <b>0901234567</b> hoặc <b>4567</b>
    </div>

  </section>


  <!-- ================= RESULTS ================= -->

  <section class="card">

    <div class="result-header">

      <h2>📋 Kết quả</h2>

      <span id="resultCount">
        0 kết quả
      </span>

    </div>

    <div id="results">

      <div class="empty">
        Nhập số điện thoại để tra cứu.
      </div>

    </div>

  </section>


  <!-- ================= ADD ================= -->

  <section class="card">

    <h2>➕ Thêm khách hàng</h2>

    <form id="customerForm">

      <div class="grid">

        <div class="form-group">
          <label>Số điện thoại *</label>

          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            required
            placeholder="0901234567"
          >
        </div>


        <div class="form-group">
          <label>Tên khách hàng</label>

          <input
            id="customer_name"
            type="text"
            placeholder="Nguyễn Văn A"
          >
        </div>


        <div class="form-group">
          <label>Tên shipper</label>

          <input
            id="shipper_name"
            type="text"
            placeholder="Tên shipper"
          >
        </div>


        <div class="form-group">
          <label>Người chạy / lắp</label>

          <input
            id="installer_name"
            type="text"
            placeholder="Tên người chạy/lắp"
          >
        </div>


        <div class="form-group">
          <label>Ấp</label>

          <input
            id="hamlet"
            type="text"
            placeholder="Ấp..."
          >
        </div>


        <div class="form-group">
          <label>Xã / Phường</label>

          <input
            id="commune"
            type="text"
            placeholder="Xã / Phường..."
          >
        </div>


        <div class="form-group">
          <label>Huyện / Thành phố</label>

          <input
            id="district"
            type="text"
            placeholder="Huyện / Thành phố..."
          >
        </div>


        <div class="form-group">
          <label>Tỉnh / Thành phố</label>

          <input
            id="province"
            type="text"
            placeholder="Tỉnh / Thành phố..."
          >
        </div>

      </div>


      <div class="form-group">

        <label>Địa chỉ chi tiết</label>

        <input
          id="address"
          type="text"
          placeholder="Số nhà, đường..."
        >

      </div>


      <div class="form-group">

        <label>Ghi chú</label>

        <textarea
          id="note"
          rows="4"
          placeholder="Thông tin thêm..."
        ></textarea>

      </div>


      <button
        class="save-button"
        type="submit"
        id="saveButton"
      >
        💾 Lưu khách hàng
      </button>

    </form>

  </section>

</main>


<footer>

  <p>
    Shipper Tra Cứu © 2026
  </p>

</footer>


<!-- Supabase phải load TRƯỚC app.js -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>
</html>
